<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-badge">🐾 Coda Garo</div>
      <h2>Iniciar Sesión</h2>
      <p>Bienvenido de nuevo a la red de rescate y adopción</p>
    </div>

    <div *ngIf="error" class="alerta-error">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="campo-grupo">
        <label for="email">Correo Electrónico</label>
        <div class="input-icon-wrapper">
          <input 
            id="email" 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="ejemplo@correo.com" 
            required 
          />
        </div>
      </div>

      <div class="campo-grupo">
        <div class="label-row">
          <label for="password">Contraseña</label>
        </div>
        <div class="input-icon-wrapper">
          <input 
            id="password" 
            [type]="mostrarPassword ? 'text' : 'password'" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="••••••••" 
            required 
          />
          <button type="button" class="btn-toggle-pwd" (click)="togglePassword()">
            {{ mostrarPassword ? '🙉' : '🙈' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="cargando">
        {{ cargando ? 'Iniciando sesión...' : 'Entrar a Coda Garo' }}
      </button>

      <div class="demo-logins">
        <p class="demo-title">¿Quieres probar rápido?</p>
        <div class="demo-buttons">
          <button type="button" class="btn-demo" (click)="loginRapido('adoptante@coda.org', 'ADOPTANTE')">
            👤 Adoptante
          </button>
          <button type="button" class="btn-demo" (click)="loginRapido('refugio@coda.org', 'REFUGIO')">
            🏡 Refugio
          </button>
        </div>
      </div>

      <div class="registro-redirect">
        ¿Aún no tienes una cuenta? 
        <a routerLink="/registro">Regístrate aquí</a>
      </div>
    </form>
  </div>
</div>
