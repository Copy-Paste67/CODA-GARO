<div class="registro-wrapper">
  <div class="registro-card">
    <div class="registro-header">
      <div class="brand-badge">🐾 Únete a Coda Garo</div>
      <h2>Crear una Cuenta</h2>
      <p>Comienza a rescatar, adoptar o apoyar a nuestras mascotas</p>
    </div>

    <div *ngIf="error" class="alerta-error">
      {{ error }}
    </div>

    <form [formGroup]="formRegistro" (ngSubmit)="onSubmit()" class="registro-form">
      <div class="campo-grupo full-width">
        <label for="nombre_completo">Nombre Completo</label>
        <input 
          id="nombre_completo" 
          type="text" 
          formControlName="nombre_completo" 
          placeholder="Ej. Ana García" 
        />
        <span class="campo-error" *ngIf="formRegistro.get('nombre_completo')?.invalid && formRegistro.get('nombre_completo')?.touched">
          El nombre completo es requerido.
        </span>
      </div>

      <div class="form-grid">
        <div class="campo-grupo">
          <label for="email">Correo Electrónico</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="ejemplo@correo.com" 
          />
          <span class="campo-error" *ngIf="formRegistro.get('email')?.invalid && formRegistro.get('email')?.touched">
            Ingresa un correo válido.
          </span>
        </div>

        <div class="campo-grupo">
          <label for="telefono">Teléfono / WhatsApp</label>
          <input 
            id="telefono" 
            type="tel" 
            formControlName="telefono" 
            placeholder="+52 33 1234 5678" 
          />
        </div>
      </div>

      <div class="campo-grupo full-width">
        <label for="rol">¿Cuál es tu rol principal?</label>
        <select id="rol" formControlName="rol">
          <option value="ADOPTANTE">🐾 Quiero Adoptar Mascotas (Adoptante)</option>
          <option value="REFUGIO">🏡 Administro un Refugio / Santuario (Refugio)</option>
          <option value="RESCATISTA">🦸 Rescato Animales en Situación de Riesgo (Rescatista)</option>
        </select>
      </div>

      <div class="form-grid">
        <div class="campo-grupo">
          <label for="password">Contraseña</label>
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            placeholder="Mínimo 6 caracteres" 
          />
          <span class="campo-error" *ngIf="formRegistro.get('password')?.invalid && formRegistro.get('password')?.touched">
            Mínimo 6 caracteres.
          </span>
        </div>

        <div class="campo-grupo">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input 
            id="confirmPassword" 
            type="password" 
            formControlName="confirmPassword" 
            placeholder="Repite la contraseña" 
          />
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="formRegistro.invalid || cargando">
        {{ cargando ? 'Creando cuenta...' : 'Crear mi Cuenta' }}
      </button>

      <div class="login-redirect">
        ¿Ya tienes una cuenta registrada? 
        <a routerLink="/login">Inicia sesión aquí</a>
      </div>
    </form>
  </div>
</div>
