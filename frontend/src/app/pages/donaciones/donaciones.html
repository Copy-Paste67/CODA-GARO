<section class="form-page">
  <h1>Hacer una donación</h1>

  <p class="form-page__aviso" *ngIf="!usuarioActual">
    Estás donando como invitado. <a routerLink="/login">Inicia sesión</a> si quieres llevar un historial de tus donaciones.
  </p>

  <form [formGroup]="formDonacion" (ngSubmit)="donar()">
    <div class="form-group">
      <label for="id_refugio">Refugio a apoyar</label>
      <select id="id_refugio" formControlName="id_refugio">
        <option value="">Selecciona un refugio</option>
        <option *ngFor="let refugio of refugios" [value]="refugio.id_refugio">
          {{ refugio.nombre_refugio }}
        </option>
      </select>
      <span class="form-error" *ngIf="formDonacion.get('id_refugio')?.invalid && formDonacion.get('id_refugio')?.touched">
        Selecciona un refugio.
      </span>
    </div>

    <div class="form-group">
      <label for="monto">Monto a donar</label>
      <input id="monto" type="number" min="1" step="0.01" formControlName="monto" />
      <span class="form-error" *ngIf="formDonacion.get('monto')?.invalid && formDonacion.get('monto')?.touched">
        El monto debe ser mayor a 0.
      </span>
    </div>

    <div class="form-group">
      <label for="metodo_pago">Método de pago</label>
      <select id="metodo_pago" formControlName="metodo_pago">
        <option value="">Selecciona un método</option>
        <option value="TARJETA">Tarjeta</option>
        <option value="TRANSFERENCIA">Transferencia</option>
        <option value="PAYPAL">PayPal</option>
      </select>
      <span class="form-error" *ngIf="formDonacion.get('metodo_pago')?.invalid && formDonacion.get('metodo_pago')?.touched">
        Selecciona un método de pago.
      </span>
    </div>

    <div class="form-page__error" *ngIf="errorFormulario">
      {{ errorFormulario }}
    </div>

    <button type="submit" class="btn btn--primary btn--full" [disabled]="formDonacion.invalid || procesando">
      {{ procesando ? 'Procesando...' : 'Donar' }}
    </button>
  </form>
</section>
