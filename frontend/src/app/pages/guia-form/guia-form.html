<section class="form-page">
  <h1>{{ esEdicion ? 'Editar guía' : 'Nueva guía de rescate' }}</h1>

  <form [formGroup]="formGuia" (ngSubmit)="guardar()">
    <div class="form-group">
      <label for="titulo">Título</label>
      <input id="titulo" type="text" formControlName="titulo" />
      <span class="form-error" *ngIf="formGuia.get('titulo')?.invalid && formGuia.get('titulo')?.touched">
        El título es obligatorio.
      </span>
    </div>

    <div class="form-group">
      <label for="especie_objetivo">Especie objetivo</label>
      <select id="especie_objetivo" formControlName="especie_objetivo">
        <option value="">Selecciona una especie</option>
        <option value="PERRO">Perro</option>
        <option value="GATO">Gato</option>
        <option value="AVE">Ave</option>
        <option value="OTRO">Otro</option>
      </select>
      <span class="form-error" *ngIf="formGuia.get('especie_objetivo')?.invalid && formGuia.get('especie_objetivo')?.touched">
        La especie objetivo es obligatoria.
      </span>
    </div>

    <div class="form-group">
      <label for="imagen_portada_url">Imagen de portada (URL, opcional)</label>
      <input id="imagen_portada_url" type="url" formControlName="imagen_portada_url" />
    </div>

    <div class="form-group">
      <label for="contenido_html">Contenido</label>
      <textarea id="contenido_html" formControlName="contenido_html" rows="10"></textarea>
      <span class="form-error" *ngIf="formGuia.get('contenido_html')?.invalid && formGuia.get('contenido_html')?.touched">
        El contenido es obligatorio.
      </span>
    </div>

    <div class="form-page__error" *ngIf="errorFormulario">
      {{ errorFormulario }}
    </div>

    <div class="form-page__acciones">
      <button type="submit" class="btn btn--primary" [disabled]="formGuia.invalid || guardando">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
      <button type="button" class="btn btn--outline" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</section>
